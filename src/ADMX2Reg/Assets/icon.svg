<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Concept B: policy shield with setting toggles, export badge -->
  <defs>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3AA0F3"/>
      <stop offset="1" stop-color="#0B4FA0"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3CC46B"/>
      <stop offset="1" stop-color="#0E8A3A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B2545" flood-opacity="0.3"/>
    </filter>
  </defs>
  <path filter="url(#shadow)" d="M128 16 C160 34 192 40 220 40 V118 C220 176 182 218 128 240 C74 218 36 176 36 118 V40 C64 40 96 34 128 16 Z" fill="url(#sh)"/>
  <path d="M128 30 C156 45 184 51 208 52 V118 C208 168 176 204 128 225" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="3"/>
  <!-- toggles: on, off, on -->
  <rect x="72" y="72" width="64" height="30" rx="15" fill="#FFFFFF"/>
  <circle cx="121" cy="87" r="10" fill="#0F6CBD"/>
  <rect x="140" y="82" width="44" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.75"/>

  <rect x="72" y="114" width="64" height="30" rx="15" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="87" cy="129" r="9" fill="#FFFFFF"/>
  <rect x="140" y="124" width="32" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.75"/>

  <rect x="72" y="156" width="64" height="30" rx="15" fill="#FFFFFF"/>
  <circle cx="121" cy="171" r="10" fill="#0F6CBD"/>
  <!-- export badge -->
  <g filter="url(#shadow)">
    <circle cx="196" cy="196" r="44" fill="url(#badge)" stroke="#FFFFFF" stroke-width="6"/>
  </g>
  <path d="M176 196 h36 m-14 -14 l14 14 l-14 14" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
