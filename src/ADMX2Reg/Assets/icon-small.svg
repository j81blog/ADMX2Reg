<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Concept B, simplified for 16-32 px: two bold toggles, larger badge, no text lines -->
  <defs>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B95EE"/>
      <stop offset="1" stop-color="#0B4FA0"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2DB85C"/>
      <stop offset="1" stop-color="#0E8A3A"/>
    </linearGradient>
  </defs>
  <path d="M120 8 C156 28 192 34 224 34 V116 C224 178 182 224 120 248 C58 224 16 178 16 116 V34 C48 34 84 28 120 8 Z" fill="url(#sh)"/>
  <!-- on -->
  <rect x="44" y="62" width="112" height="52" rx="26" fill="#FFFFFF"/>
  <circle cx="130" cy="88" r="18" fill="#0B5CB0"/>
  <!-- off -->
  <rect x="50" y="134" width="100" height="44" rx="22" fill="none" stroke="#FFFFFF" stroke-width="12"/>
  <circle cx="72" cy="156" r="13" fill="#FFFFFF"/>
  <!-- export badge -->
  <circle cx="194" cy="194" r="56" fill="url(#badge)" stroke="#FFFFFF" stroke-width="10"/>
  <path d="M166 194 h52 m-20 -21 l21 21 l-21 21" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
